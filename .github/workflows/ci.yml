# The gate for a push is the part of `make ci` that needs no build: the formatting, the agent-file
# guard and the lint (shellcheck, the changelog at the version). It builds no WebKit: a build
# takes about 20 minutes of a 24-core desk and more than 20 GB of memory, so `make ci`, with the
# build, its checks, the smoke test and lintian, runs on a desk before a package is published
# (docs/DECISIONS.md, 8).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The desk's layout: each root project.toml's siblings use, under the desk's name, in the
    # folder above the workspace. house-rules is private and not a sibling, so the lint says it
    # skips the house's checks here.
    env:
      AMBER_ROOT: ${{ github.workspace }}/../amber
    steps:
      - uses: actions/checkout@v5

      # project.toml is the one list; amber-gtk4 is public and needs no token.
      - name: siblings
        run: make init-siblings

      # The packages are project.toml's, with amber-gtk4's.
      - name: system packages
        run: sudo apt-get update && make init-packages APT_FLAGS=-y

      - name: lint
        run: make init-modules check-fmt check-no-agent-files lint
